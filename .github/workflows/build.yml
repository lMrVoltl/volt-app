name: Build Volt AI APK
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  preflight:
    name: Fast Checks (JS, JNI, XML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JS syntax in index.html
        run: |
          python3 - << 'PY'
          import re, subprocess, sys
          html = open("app/src/main/assets/index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script[^>]*>([\s\S]*?)</script>", html)
          assert scripts, "No <script> block found in index.html"
          open("/tmp/volt_ui.js", "w", encoding="utf-8").write("\n".join(scripts))
          res = subprocess.run(["node", "--check", "/tmp/volt_ui.js"], capture_output=True, text=True)
          if res.returncode != 0:
              print("JS SYNTAX ERROR:\n", res.stderr)
              sys.exit(1)
          print("✅ JS syntax OK")
          PY

      - name: Check JNI signatures & XML files
        run: |
          python3 - << 'PY'
          import os, xml.etree.ElementTree as ET

          kt = open("app/src/main/java/com/voltage/ai/MainActivity.kt", encoding="utf-8").read()
          cpp = open("app/src/main/cpp/volt_jni.cpp", encoding="utf-8").read()

          for fn in ["nativeLoadModel", "nativeGenerate", "nativeStop"]:
              assert f"external fun {fn}" in kt, f"Missing {fn} in MainActivity.kt"
              assert f"MainActivity_{fn}" in cpp, f"Missing {fn} in volt_jni.cpp"

          assert 'onNativeStats", "(IDDILjava/lang/String;)V"' in cpp, "onNativeStats signature mismatch in volt_jni.cpp"
          assert "fun onNativeStats(tokens: Int, tps: Double, totalSec: Double, visionState: Int, visionErr: String)" in kt, "onNativeStats signature mismatch in MainActivity.kt"

          for xml_file in [
              "app/src/main/AndroidManifest.xml",
              "app/src/main/res/xml/accessibility_service_config.xml"
          ]:
              assert os.path.exists(xml_file), f"Missing {xml_file}"
              ET.parse(xml_file)

          print("✅ JNI signatures and XML files OK")
          PY

  build:
    name: Build & Release APK
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'

      - name: Build stable-diffusion.cpp (arm64-v8a + Vulkan GPU + KleidiAI)
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          SYSROOT_USR="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr"
          SYSROOT_INC="$SYSROOT_USR/include"

          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Hpp.git /tmp/Vulkan-Hpp
          git -C /tmp/Vulkan-Hpp submodule update --init Vulkan-Headers
          cp -r /tmp/Vulkan-Hpp/Vulkan-Headers/include/vulkan/* "$SYSROOT_INC/vulkan/"
          cp -r /tmp/Vulkan-Hpp/Vulkan-Headers/include/vk_video "$SYSROOT_INC/"
          cp /tmp/Vulkan-Hpp/vulkan/*.hpp "$SYSROOT_INC/vulkan/"
          grep -E '^#define VK_HEADER_VERSION ' "$SYSROOT_INC/vulkan/vulkan_core.h"

          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Headers
          cmake -S /tmp/SPIRV-Headers -B /tmp/SPIRV-Headers/build -DCMAKE_INSTALL_PREFIX="$SYSROOT_USR"
          cmake --install /tmp/SPIRV-Headers/build

          git clone --recursive --depth 1 https://github.com/leejet/stable-diffusion.cpp.git /tmp/sd.cpp
          cmake -S /tmp/sd.cpp -B /tmp/sd-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSD_BUILD_SHARED_LIBS=OFF \
            -DSD_VULKAN=ON \
            -DGGML_VULKAN=ON \
            -DSPIRV-Headers_DIR="$SYSROOT_USR/share/cmake/SPIRV-Headers" \
            -DVulkan_GLSLC_EXECUTABLE="$NDK_HOME/shader-tools/linux-x86_64/glslc" \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_KLEIDIAI=ON \
            -DSD_BUILD_EXAMPLES=ON
          cmake --build /tmp/sd-build -j$(nproc)
          SD_BIN=$(find /tmp/sd-build -type f \( -name "sd-cli" -o -name "sd" \) -executable | head -n 1)
          echo "Found SD binary: $SD_BIN"
          test -n "$SD_BIN"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$SD_BIN" app/src/main/jniLibs/arm64-v8a/libvolt_sd.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libvolt_sd.so
          ls -lh app/src/main/jniLibs/arm64-v8a/libvolt_sd.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Verify APK & Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VoltAI.apk
          unzip -tq VoltAI.apk
          gh release delete app-latest -y || true
          gh release create app-latest VoltAI.apk --title "Volt AI APK" --notes "Автосборка Volt AI (LLM + Vulkan GPU SD Studio + Real-ESRGAN 4x)"
