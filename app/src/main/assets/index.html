<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Volt AI</title>
<style>
  :root{--bg:#131314;--surf:#1e1f20;--surf2:#282a2c;--txt:#e3e3e3;--sub:#9aa0a6;--acc:#a8c7fa;--accTxt:#062e6f;--ok:#81c995}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,system-ui,sans-serif}
  body{background:var(--bg);color:var(--txt);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  header{height:56px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .pill{background:var(--surf);border:none;color:var(--txt);padding:8px 14px;border-radius:20px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
  .icon-btn{width:40px;height:40px;border-radius:20px;border:none;background:transparent;color:var(--txt);display:grid;place-items:center}
  main{flex:1;overflow-y:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:16px}
  .welcome{margin:auto 0;padding:16px 4px}
  .welcome h1{font-size:28px;font-weight:500;background:linear-gradient(90deg,#a8c7fa,#c58af9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .welcome p{color:var(--sub);margin-top:8px;font-size:15px}
  .msg-u{align-self:flex-end;background:var(--surf2);padding:12px 16px;border-radius:22px 22px 6px 22px;max-width:85%;font-size:15px;line-height:1.45;word-break:break-word}
  .msg-u img{max-width:100%;border-radius:12px;margin-bottom:8px;display:block}
  .att-tag{font-size:12px;color:var(--acc);background:rgba(168,199,250,.12);padding:4px 8px;border-radius:8px;margin-bottom:6px;display:inline-block}
  .msg-a{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.55}
  .spark{width:26px;height:26px;border-radius:13px;background:var(--surf2);display:grid;place-items:center;flex-shrink:0;color:var(--acc);margin-top:2px}
  .bot-txt{flex:1;min-width:0;word-break:break-word}
  .bot-txt pre{background:#0d0d0e;padding:12px;border-radius:12px;overflow-x:auto;margin:8px 0;font-family:monospace;font-size:13px;position:relative}
  .bot-txt code{font-family:monospace;background:var(--surf2);padding:2px 5px;border-radius:5px;font-size:13px}
  .bot-txt pre code{background:transparent;padding:0}
  .copy-btn{position:absolute;top:6px;right:6px;background:var(--surf2);color:var(--txt);border:none;border-radius:6px;padding:3px 8px;font-size:11px}
  footer{padding:6px 12px 14px;background:var(--bg);flex-shrink:0}
  .preview-bar{display:none;align-items:center;gap:8px;background:var(--surf);padding:8px 12px;border-radius:16px 16px 0 0;margin-bottom:-8px;padding-bottom:14px;font-size:13px;color:var(--acc)}
  .preview-bar.show{display:flex}
  .preview-bar img{height:36px;width:36px;object-fit:cover;border-radius:8px}
  .dock{background:var(--surf);border-radius:28px;padding:8px 10px 8px 8px;display:flex;align-items:flex-end;gap:6px;position:relative;z-index:2}
  .attach-btn{width:40px;height:40px;border-radius:20px;border:none;background:var(--surf2);color:var(--txt);display:grid;place-items:center;flex-shrink:0}
  textarea{flex:1;background:transparent;border:none;color:var(--txt);font-size:16px;resize:none;max-height:120px;outline:none;padding:8px 4px}
  .send{width:40px;height:40px;border-radius:20px;border:none;background:var(--acc);color:var(--accTxt);display:grid;place-items:center;flex-shrink:0}
  .drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:30}
  .drawer-bg.open{display:flex}
  .drawer{background:var(--surf);width:80%;max-width:300px;height:100%;padding:20px 14px;display:flex;flex-direction:column;gap:10px}
  .chat-item{padding:11px 12px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--txt)}
  .chat-item.active{background:var(--surf2);color:var(--acc);font-weight:500}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:25}
  .sheet-bg.open{display:flex}
  .sheet{background:var(--surf);width:100%;border-radius:28px 28px 0 0;padding:20px 16px 28px;max-height:82dvh;overflow-y:auto}
  .card{background:var(--surf2);border-radius:20px;padding:14px;margin-top:12px}
  .badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:12px;background:rgba(129,201,149,.18);color:var(--ok);margin-bottom:6px}
  .btn{width:100%;margin-top:10px;padding:10px;border-radius:14px;border:none;background:var(--acc);color:var(--accTxt);font-weight:600;font-size:14px}
  .btn.sec{background:var(--surf);color:var(--txt)}
</style>
</head>
<body>
<header>
  <button class="icon-btn" onclick="openDrawer()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <button class="pill" onclick="openSheet('modelSheet')">
    <span id="curModelName">Выбрать модель</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <button class="icon-btn" onclick="createNewChat()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</header>

<main id="chat"></main>

<footer>
  <div class="preview-bar" id="previewBar">
    <img id="prevImg" style="display:none">
    <span id="prevLabel" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <button onclick="clearAttachment()" style="background:none;border:none;color:var(--sub);font-size:18px">✕</button>
  </div>
  <div class="dock">
    <input type="file" id="fileInp" style="display:none" accept="image/*,.txt,.md,.py,.cpp,.c,.h,.kt,.java,.js,.json,.html,.css,.csv,.xml,.log" onchange="handleFile(this)">
    <button class="attach-btn" onclick="document.getElementById('fileInp').click()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <textarea id="inp" rows="1" placeholder="Спросите Volt..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
    <button class="send" id="sendBtn" onclick="send()">
      <svg id="sendIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</footer>

<div class="drawer-bg" id="drawerBg" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer">
    <button class="btn" style="margin-top:0" onclick="createNewChat();closeDrawer()">+ Новый чат</button>
    <div style="font-size:12px;color:var(--sub);margin-top:8px">Недавние чаты</div>
    <div id="chatList" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px"></div>
  </div>
</div>

<div class="sheet-bg" id="modelSheet" onclick="if(event.target===this)closeSheets()">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>Модели VOLTAGE</h3>
      <span id="ramChip" style="font-size:12px;color:var(--sub)"></span>
    </div>
    <div id="modelsList" style="margin-top:8px;color:var(--sub);font-size:14px">Загрузка каталога с GitHub...</div>
  </div>
</div>

<script>
let freeRamMb = 2000, models = [], activeId = null, activeBotEl = null, rawStream = '', generating = false;
let chats = JSON.parse(localStorage.getItem('volt_chats') || '[]');
let currentChatId = null, pendingAttachment = null;

function saveChats(){ localStorage.setItem('volt_chats', JSON.stringify(chats)); }
function openDrawer(){ renderChatList(); document.getElementById('drawerBg').classList.add('open'); }
function closeDrawer(){ document.getElementById('drawerBg').classList.remove('open'); }
function openSheet(id){ document.getElementById(id).classList.add('open'); }
function closeSheets(){ document.querySelectorAll('.sheet-bg').forEach(e=>e.classList.remove('open')); }

function formatMd(txt) {
  let esc = txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  esc = esc.replace(/```([\s\S]*?)```/g, (_, code) =>
    '<pre><button class="copy-btn" onclick="navigator.clipboard.writeText(this.parentElement.innerText.replace(\'Копировать\',\'\').trim())">Копировать</button><code>' + code.trim() + '</code></pre>'
  );
  esc = esc.replace(/`([^`]+)`/g, '<code>$1</code>');
  esc = esc.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return esc.replace(/\n/g, '<br>');
}

function createNewChat() {
  currentChatId = 'c_' + Date.now();
  chats.unshift({ id: currentChatId, title: 'Новый чат', messages: [] });
  saveChats();
  renderCurrentChat();
}

function switchChat(id) {
  currentChatId = id;
  renderCurrentChat();
  closeDrawer();
}

function deleteChat(e, id) {
  e.stopPropagation();
  chats = chats.filter(c => c.id !== id);
  saveChats();
  if (currentChatId === id) {
    if (chats.length) switchChat(chats[0].id);
    else createNewChat();
  }
  renderChatList();
}

function renderChatList() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  chats.forEach(c => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
    div.onclick = () => switchChat(c.id);
    div.innerHTML = '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">' + c.title + '</span>' +
      '<span onclick="deleteChat(event,\'' + c.id + '\')" style="color:var(--sub);padding-left:8px">✕</span>';
    list.appendChild(div);
  });
}

function renderCurrentChat() {
  const box = document.getElementById('chat');
  const c = chats.find(x => x.id === currentChatId);
  if (!c || !c.messages.length) {
    const freeGb = (freeRamMb / 1024).toFixed(1);
    box.innerHTML = '<div class="welcome" id="welcome"><h1>Привет, Volt AI</h1><p id="ramHint">' +
      (activeId ? 'Модель готова. Можно писать текст, кидать код или фото.' : 'Свободно ' + freeGb + ' ГБ RAM. Выбери модель сверху.') + '</p></div>';
    return;
  }
  box.innerHTML = '';
  c.messages.forEach(m => {
    if (m.role === 'user') {
      const u = document.createElement('div');
      u.className = 'msg-u';
      let html = '';
      if (m.img) html += '<img src="' + m.img + '">';
      if (m.fileName) html += '<div class="att-tag">📎 ' + m.fileName + '</div><br>';
      html += m.displayText.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
      u.innerHTML = html;
      box.appendChild(u);
    } else {
      const a = document.createElement('div');
      a.className = 'msg-a';
      a.innerHTML = '<div class="spark">✦</div><div class="bot-txt">' + formatMd(m.text) + '</div>';
      box.appendChild(a);
    }
  });
  box.scrollTop = box.scrollHeight;
}

function handleFile(inp) {
  const file = inp.files[0];
  if (!file) return;
  const bar = document.getElementById('previewBar');
  const imgEl = document.getElementById('prevImg');
  const lbl = document.getElementById('prevLabel');

  if (file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = () => {
      imgEl.src = reader.result;
      imgEl.style.display = 'block';
      lbl.innerText = 'Распознавание текста с фото...';
      bar.classList.add('show');
      pendingAttachment = { type: 'image', name: file.name, dataUrl: reader.result, extracted: '' };
      VoltAndroid.recognizeImageOcr(reader.result);
    };
    reader.readAsDataURL(file);
  } else {
    const reader = new FileReader();
    reader.onload = () => {
      imgEl.style.display = 'none';
      lbl.innerText = '📎 ' + file.name;
      bar.classList.add('show');
      pendingAttachment = { type: 'file', name: file.name, content: reader.result.slice(0, 8000) };
    };
    reader.readAsText(file);
  }
  inp.value = '';
}

window.onOcrDone = (txt) => {
  if (pendingAttachment && pendingAttachment.type === 'image') {
    pendingAttachment.extracted = txt;
    document.getElementById('prevLabel').innerText = txt.trim() ? '🖼 Фото + распознанный текст' : '🖼 Фото прикреплено';
  }
};

function clearAttachment() {
  pendingAttachment = null;
  document.getElementById('previewBar').classList.remove('show');
}

window.onload = () => {
  if (!chats.length) createNewChat(); else { currentChatId = chats[0].id; renderCurrentChat(); }
  if (window.VoltAndroid) {
    const ram = JSON.parse(VoltAndroid.getDeviceRamJson());
    freeRamMb = ram.free_mb;
    const freeGb = (freeRamMb / 1024).toFixed(1);
    const totGb = (ram.total_mb / 1024).toFixed(1);
    document.getElementById('ramChip').innerText = 'Свободно ' + freeGb + ' / ' + totGb + ' ГБ';
    VoltAndroid.fetchCatalog();
  }
};

window.onCatalogLoaded = (raw) => {
  models = JSON.parse(raw).models;
  renderModels();
  const ready = models.find(m => m.downloaded && freeRamMb >= m.min_free_ram_mb) || models.find(m => m.downloaded);
  if (ready) activateModel(ready.id);
};
window.onCatalogError = (err) => {
  document.getElementById('modelsList').innerHTML = '<div>Ошибка: ' + err + '</div><button class="btn" onclick="VoltAndroid.fetchCatalog()">Повторить</button>';
};

function renderModels() {
  const box = document.getElementById('modelsList');
  box.innerHTML = '';
  const rec = [...models].reverse().find(m => freeRamMb >= m.min_free_ram_mb) || models[0];
  models.forEach(m => {
    const isRec = rec && rec.id === m.id;
    const isAct = activeId === m.id;
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = (isRec ? '<div class="badge">Рекомендовано для устройства</div>' : '') +
      '<div style="display:flex;justify-content:space-between"><b>' + m.name + '</b><span style="font-size:12px;color:var(--sub)">' + m.params + ' • ' + m.size_mb + ' МБ</span></div>' +
      '<div style="font-size:13px;color:var(--sub);margin-top:4px">' + m.description + '</div>' +
      '<div id="act-' + m.id + '">' +
      (m.downloaded
        ? '<button class="btn ' + (isAct ? 'sec' : '') + '" onclick="activateModel(\'' + m.id + '\')">' + (isAct ? 'Активна' : 'Запустить модель') + '</button>'
        : '<button class="btn" onclick="startDownload(\'' + m.id + '\',\'' + m.download_url + '\')">Скачать с GitHub (' + m.size_mb + ' МБ)</button>') +
      '</div>';
    box.appendChild(div);
  });
}

function startDownload(id, url) {
  document.getElementById('act-' + id).innerHTML = '<button class="btn sec" disabled id="prog-' + id + '">Скачивание: 0%</button>';
  VoltAndroid.downloadModel(id, url);
}
window.onDownloadProgress = (id, pct) => {
  const el = document.getElementById('prog-' + id);
  if (el) el.innerText = 'Скачивание: ' + pct + '%';
};
window.onDownloadDone = (id) => {
  const m = models.find(x => x.id === id);
  if (m) m.downloaded = true;
  renderModels();
  activateModel(id);
};
window.onDownloadError = (id, err) => {
  document.getElementById('act-' + id).innerHTML = '<div style="color:#f28b82;font-size:12px;margin-top:8px">Ошибка: ' + err + '</div>';
};

function activateModel(id) {
  const m = models.find(x => x.id === id);
  if (!m) return;
  document.getElementById('curModelName').innerText = 'Загрузка ' + m.name + '...';
  closeSheets();
  VoltAndroid.loadModel(id);
}
window.onModelLoaded = (id, ok) => {
  const m = models.find(x => x.id === id);
  if (ok && m) {
    activeId = id;
    document.getElementById('curModelName').innerText = m.name;
    renderCurrentChat();
    renderModels();
  } else {
    document.getElementById('curModelName').innerText = 'Ошибка загрузки в RAM';
  }
};

function setGenerating(state) {
  generating = state;
  document.getElementById('sendIcon').innerHTML = state
    ? '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>'
    : '<path d="M5 12h14M13 6l6 6-6 6"/>';
}

function send() {
  if (generating) { VoltAndroid.stopGeneration(); return; }
  const inp = document.getElementById('inp');
  const txt = inp.value.trim();
  if (!txt && !pendingAttachment) return;
  if (!activeId) { openSheet('modelSheet'); return; }

  const c = chats.find(x => x.id === currentChatId);
  let llmText = txt;
  const userMsg = { role: 'user', displayText: txt || 'Проанализируй вложение' };

  if (pendingAttachment) {
    if (pendingAttachment.type === 'file') {
      userMsg.fileName = pendingAttachment.name;
      llmText = (txt || 'Разбери содержимое файла:') + '\n\n[Файл: ' + pendingAttachment.name + ']\n' + pendingAttachment.content;
    } else if (pendingAttachment.type === 'image') {
      userMsg.img = pendingAttachment.dataUrl;
      llmText = (txt || 'Что изображено на фото?') + (pendingAttachment.extracted ? '\n\n[Текст с изображения]:\n' + pendingAttachment.extracted : '\n\n[Пользователь прикрепил изображение без распознанного текста]');
    }
    clearAttachment();
  }
  userMsg.llmText = llmText;

  if (!c.messages.length) c.title = (txt || userMsg.fileName || 'Фото').slice(0, 32);
  c.messages.push(userMsg);
  saveChats();
  renderCurrentChat();

  const chatEl = document.getElementById('chat');
  const a = document.createElement('div');
  a.className = 'msg-a';
  a.innerHTML = '<div class="spark">✦</div><div class="bot-txt"></div>';
  chatEl.appendChild(a);
  activeBotEl = a.querySelector('.bot-txt');
  rawStream = '';

  inp.value = '';
  inp.style.height = 'auto';
  setGenerating(true);
  chatEl.scrollTop = chatEl.scrollHeight;

  const recent = c.messages.slice(-6).map(m =>
    m.role === 'user'
      ? '<|im_start|>user\n' + m.llmText + '<|im_end|>\n'
      : '<|im_start|>assistant\n' + m.text + '<|im_end|>\n'
  ).join('');
  VoltAndroid.sendPrompt(recent);
}

window.onVoltToken = (tok) => {
  if (activeBotEl) {
    rawStream += tok;
    activeBotEl.innerHTML = formatMd(rawStream);
    const chatEl = document.getElementById('chat');
    chatEl.scrollTop = chatEl.scrollHeight;
  }
};
window.onVoltDone = () => {
  const c = chats.find(x => x.id === currentChatId);
  if (c && rawStream) {
    c.messages.push({ role: 'assistant', text: rawStream });
    saveChats();
  }
  setGenerating(false);
  activeBotEl = null;
};
</script>
</body>
</html>
